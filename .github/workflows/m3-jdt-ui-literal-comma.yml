name: M3 JDT UI Literal Comma Parity
on:
  pull_request:
    paths:
      - 'org.eclipse.jdt.core.manipulation/**'
      - 'tools/m3/LiteralCommaRegexParity.java'
      - '.github/workflows/m3-jdt-ui-literal-comma.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Diff hygiene
        run: git diff --check origin/master...HEAD
      - name: Java 21 differential test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/literal-comma"
          javac --release 21 -encoding UTF-8 -Xlint:all -Werror \
            -d "$RUNNER_TEMP/literal-comma" tools/m3/LiteralCommaRegexParity.java
          java -cp "$RUNNER_TEMP/literal-comma" LiteralCommaRegexParity
